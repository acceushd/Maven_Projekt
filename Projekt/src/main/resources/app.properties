# Project info (from the POM)
app.name=${project.name}
app.description=${project.description}
app.version=${project.version}
app.groupId=${project.groupId}
app.artifactId=${project.artifactId}
app.developer.1=${project.developers[0].name}
app.developer.2=${project.developers[1].name}
app.developer.3=${project.developers[2].name}
# Name of the final jar file (without .jar)
app.jar=${project.build.finalName}

app.os=${os.name}
app.osVersion=${os.version}
# Values from your own <properties> block
app.mainClass=${main.class}

# Build time (needs the format property, see below)
app.buildTime=${build.time.local}

# Java version used for compiling
app.javaRelease=${maven.compiler.release}